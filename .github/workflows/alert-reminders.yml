name: Alert Reminders

on:
  schedule:
    # 14:00 UTC daily (~9am ET / 7am MT). Adjust to whatever local time you prefer.
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  send:
    name: Trigger reminder cron
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Hit /api/cron/alert-reminders
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not set in the repository. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set in the repository. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl -fsSL --max-time 60 \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$APP_URL/api/cron/alert-reminders"

      # Supabase free-tier projects are paused after 7 days of inactivity.
      # The cron above reads the DB through the app, but it only counts as
      # activity if the app endpoint succeeds. Run a direct lightweight read
      # against the database as a guaranteed keep-alive.
      - name: Keep Supabase active (direct DB read)
        if: always()
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in the repository. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          psql "$DATABASE_URL" -c "SELECT 1;"
